name: Reset Demo Data

# The production demo publishes its credentials, so visitors can change or delete shared data.
# Reseeding restores it and keeps the seeded dates current.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Separate from the deployment group: a queued reset must never displace a pending deployment.
concurrency:
  group: reset-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    # Manual runs from other branches must not seed production with unreviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json `packageManager`. Pinned to the v4 commit (third-party action).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Migrates first so the seed always matches the schema of this checkout. The confirmation host is
      # derived here so this job can only reset the configured database.
      - name: Reseed production demo
        run: |
          pnpm db:migrate
          host="${DATABASE_URL#*://}"
          export IKIZEN_CONFIRM_REMOTE_SEED="${host%%[/?]*}"
          pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
